# Pre-commit (ADR-018): the same steps as CI, in the same order, on what is staged.
# Bypassable with --no-verify, so the guarantee is CI (.github/workflows/ci.yml); agents never bypass it.
pre-commit:
  piped: true # stop on the first failing step
  jobs:
    - name: contracts are generated
      # ADR-035: before typecheck, which reads the generated file.
      glob: '{apps/backend/src/**/*.{router,request.dto,response.dto,enum}.ts,packages/contracts/**,scripts/contracts-generate.ts}'
      run: pnpm contracts:check

    - name: typecheck
      glob: '{apps,packages}/**/*.{ts,tsx,json}'
      # Whole-package tsc cannot run per file; Turborepo caches what did not change.
      run: pnpm turbo run typecheck --affected

    - name: prettier
      glob: '{apps/**,packages/**,package.json,turbo.json,.dependency-cruiser.mjs,scripts/boundaries.test.ts,scripts/charts-check.ts,scripts/charts.test.ts,scripts/contracts-generate.ts,scripts/contracts-typecheck.ts,scripts/contracts-typecheck.test.ts,scripts/lib/backend-contract-files.ts,scripts/check-migrations.ts,scripts/check-migrations.test.ts,scripts/image-check.ts,scripts/seal-secret.ts,scripts/seal-secret.test.ts}'
      run: pnpm exec prettier --write --ignore-unknown {staged_files}
      stage_fixed: true

    - name: eslint backend
      root: apps/backend/
      glob: '*.{ts,js}'
      run: pnpm exec eslint --fix {staged_files}
      stage_fixed: true

    - name: eslint frontend
      root: apps/frontend/
      glob: '*.{ts,tsx,js}'
      run: pnpm exec eslint --fix {staged_files}
      stage_fixed: true

    - name: boundaries
      glob: '{apps/**/*.{ts,tsx},packages/**/*.ts,.dependency-cruiser.mjs,scripts/boundaries.test.ts}'
      run: pnpm deps

    - name: boundary rules fire on violations
      glob: '{.dependency-cruiser.mjs,scripts/boundaries.test.ts}'
      run: pnpm deps:test

    - name: helm lint and template
      # Last, and only when the deploy files changed (ADR-019). Helm is a local requirement (AGENTS.md).
      glob: '{deploy/charts/**,deploy/apps/**,deploy/argocd/**,scripts/charts-check.ts,scripts/seal-secret.ts,scripts/lib/argocd-application.ts}'
      run: pnpm charts

    - name: chart behaviour
      glob: '{deploy/charts/**,deploy/argocd/**,scripts/charts.test.ts,scripts/lib/argocd-application.ts}'
      run: pnpm charts:test

    - name: secret sealing script
      glob: '{scripts/seal-secret.ts,scripts/seal-secret.test.ts}'
      run: pnpm secrets:seal:test
