            {
             "id": 7,
             "type": "volkovlabs-echarts-panel",
             "title": "CPU",
             "description": "Дуга - сколько CPU зарезервировано (requests работающих подов) каждой частью кластера, и сколько не зарезервировано никому (Free); все доли - от ёмкости для подов (allocatable узлов). Центр - сколько CPU поды используют сейчас, от той же ёмкости, без системы узла: «CPU по узлам» ниже показывает больше. Часть без requests (ArgoCD) на дуге - 0, хотя CPU использует. FE - frontend, BE - backend, NATS, Debezium, kube - kube-system (сеть Cilium, DNS, агенты DO, контроллер Sealed Secrets), Traefik, Prometheus с экспортёрами, Grafana, ArgoCD; «Прочее» - под, который не попал ни в одну группу, виден, только когда он есть. (ADR-084, ADR-085)",
             "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
             },
             "gridPos": {
              "h": 14,
              "w": 24,
              "x": 0,
              "y": 0
             },
             "options": {
              "renderer": "canvas",
              "editorMode": "code",
              "editor": {
               "format": "auto"
              },
              "themeEditor": {
               "name": "default",
               "config": "{}"
              },
              "map": "none",
              "getOption": "// Arc: what each component reserves (CPU and memory: requests of running pods; volumes: bytes used on its volumes)\n// and what nobody has reserved (Free); centre: what is used now. Every share is of the same capacity, so the segments\n// add up to 100% (ADR-084, ADR-085).\nconst KIND = 'cpu';\nconst theme = context.grafana.theme;\nconst text = theme.colors.text;\nconst series = context.panel.data.series;\nconst lastOf = (field) => {\n  const values = field ? Array.from(field.values) : [];\n  return values.length ? Number(values[values.length - 1]) || 0 : 0;\n};\nconst single = (ref) => {\n  const s = series.find((x) => x.refId === ref);\n  return s ? lastOf(s.fields.find((f) => f.type === 'number')) : 0;\n};\n\n// Who is who, by namespace and by the name of the pod (or of the volume); the first match wins. A pod named by none\n// of them lands in \"Прочее\", which is shown only when it is not empty, so the shares still add up to 100%.\nconst GROUPS = [\n  { name: 'FE', color: '#B877D9', match: (ns, n) => ns === 'bf' && /^frontend-/.test(n) },\n  { name: 'BE', color: '#5794F2', match: (ns, n) => ns === 'bf' && /^backend-/.test(n) },\n  { name: 'NATS', color: '#C4A27A', match: (ns, n) => ns === 'bf' && /^nats-/.test(n) },\n  { name: 'Debezium', color: '#8C564B', match: (ns, n) => /^debezium/.test(n) },\n  { name: 'kube', color: '#6E7079', match: (ns) => ns.startsWith('kube-') },\n  { name: 'Traefik', color: '#24A1C1', match: (ns) => ns === 'traefik' },\n  {\n    name: 'Prometheus + экспортёры',\n    short: 'Prometheus',\n    color: '#E6522C',\n    match: (ns, n) => ns === 'monitoring' && !/^grafana/.test(n),\n  },\n  { name: 'Grafana', color: '#F2CC0C', match: (ns, n) => ns === 'monitoring' && /^grafana/.test(n) },\n  { name: 'ArgoCD', color: '#FF9EC7', match: (ns) => ns === 'argocd' },\n  { name: 'Прочее', color: '#A0A0A0', match: () => true, hideEmpty: true },\n];\n\nconst capacity = single('capacity');\nconst used = single('used');\nconst parts = GROUPS.map((g) => ({ ...g, short: g.short || g.name, value: 0 }));\nfor (const s of series.filter((x) => x.refId === 'groups')) {\n  for (const field of s.fields.filter((f) => f.type === 'number')) {\n    const labels = field.labels || {};\n    const name = labels.pod || labels.persistentvolumeclaim || '';\n    parts.find((p) => p.match(labels.namespace || '', name)).value += lastOf(field);\n  }\n}\nconst reserved = parts.reduce((a, p) => a + p.value, 0);\nparts.push({ name: 'Free', short: 'Free', color: '#73BF69', value: Math.max(capacity - reserved, 0) });\nconst shown = parts.filter((p) => !(p.hideEmpty && p.value === 0));\n\nconst amount = (x) => {\n  if (KIND === 'cpu') return x.toFixed(x >= 10 ? 1 : 2) + ' vCPU';\n  const units = ['B', 'KiB', 'MiB', 'GiB', 'TiB'];\n  let i = 0;\n  while (x >= 1024 && i < units.length - 1) {\n    x /= 1024;\n    i += 1;\n  }\n  return x.toFixed(i === 0 || x >= 100 ? 0 : 1) + ' ' + units[i];\n};\n\n// Shares in tenths of a percent, rounded by the largest remainder so the ones shown add up to exactly 100.0%.\nconst exact = shown.map((p) => (capacity > 0 ? (p.value / capacity) * 1000 : 0));\nconst tenths = exact.map(Math.floor);\nlet rest = capacity > 0 ? 1000 - tenths.reduce((a, b) => a + b, 0) : 0;\nexact\n  .map((x, i) => [x - Math.floor(x), i])\n  .sort((a, b) => b[0] - a[0])\n  .forEach(([, i]) => {\n    if (rest > 0) {\n      tenths[i] += 1;\n      rest -= 1;\n    }\n  });\nshown.forEach((p, i) => {\n  p.share = capacity > 0 ? p.value / capacity : 0;\n  p.percent = (tenths[i] / 10).toFixed(1) + '%';\n});\n\nconst usedShare = capacity > 0 ? (used / capacity) * 100 : 0;\nconst color = (name) => theme.visualization.getColorByName(name);\nconst usedColor = usedShare >= 85 ? color('red') : usedShare >= 60 ? color('orange') : color('green');\nconst arc = shown.filter((p) => p.value > 0).sort((a, b) => a.value - b.value);\n\nreturn {\n  backgroundColor: 'transparent',\n  tooltip: {\n    trigger: 'item',\n    formatter: (p) => p.name + ': ' + p.data.percent + ' · ' + amount(p.value),\n  },\n  series: [\n    {\n      type: 'pie',\n      startAngle: 180,\n      endAngle: 0,\n      clockwise: true,\n      radius: ['56%', '90%'],\n      center: ['28%', '74%'],\n      avoidLabelOverlap: true,\n      minAngle: 1,\n      itemStyle: { borderColor: theme.colors.background.primary, borderWidth: 2, borderRadius: 3 },\n      label: {\n        formatter: (p) => '{pct|' + p.data.percent + '}\\n{abs|' + amount(p.value) + '}',\n        rich: {\n          pct: { fontSize: 14, fontWeight: 700, lineHeight: 17 },\n          abs: { fontSize: 11, lineHeight: 13 },\n        },\n      },\n      // Only a segment of 3% or more is labelled on the arc; every one is in the legend and the tooltip.\n      data: arc.map((p) => {\n        const inside = p.share >= 0.12;\n        const labelled = p.share >= 0.03;\n        return {\n          name: p.name,\n          value: p.value,\n          percent: p.percent,\n          itemStyle: { color: p.color },\n          label: {\n            show: labelled,\n            position: inside ? 'inside' : 'outside',\n            color: inside ? '#ffffff' : text.primary,\n          },\n          labelLine: { show: labelled && !inside, length: 6, length2: 6 },\n        };\n      }),\n    },\n  ],\n  title: [\n    {\n      left: '28%',\n      top: '49%',\n      textAlign: 'center',\n      text:\n        '{big|' + usedShare.toFixed(usedShare >= 10 ? 0 : 1) + '%}\\n' +\n        '{used|' + amount(used) + '}{sep|/}{total|' + amount(capacity) + '}\\n' +\n        '{hint|используется сейчас}',\n      textStyle: {\n        rich: {\n          big: { fontSize: 34, fontWeight: 700, color: usedColor, lineHeight: 40 },\n          used: { fontSize: 14, color: text.secondary, lineHeight: 20 },\n          sep: { fontSize: 14, color: text.secondary, lineHeight: 20, padding: [0, 5] },\n          total: { fontSize: 14, fontWeight: 700, color: text.primary, lineHeight: 20 },\n          hint: { fontSize: 12, color: text.secondary, lineHeight: 16 },\n        },\n      },\n    },\n    // The legend is a table on the right: one row per part, in the order of GROUPS, Free last.\n    ...shown.map((p, i) => ({\n      left: '58%',\n      top: (8 + (84 / shown.length) * i).toFixed(1) + '%',\n      text:\n        '{dot|■}{name|' + p.name + '}{pct|' + p.percent + '}{abs|' + amount(p.value) + '}',\n      textStyle: {\n        rich: {\n          dot: { fontSize: 22, color: p.color, width: 28 },\n          name: { fontSize: 14, color: text.primary, width: 200 },\n          pct: { fontSize: 15, fontWeight: 700, color: text.primary, width: 70, align: 'right' },\n          abs: { fontSize: 13, color: text.secondary, width: 110, align: 'right' },\n        },\n      },\n    })),\n  ],\n};\n"
