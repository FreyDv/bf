# The backend without a database (DEPLOY-1). The CA, the two database secrets and the migration Job arrive with
# DEPLOY-2, so there is no secret, no dbCa and `migration.enabled` stays false (ADR-019, ADR-061).
image:
  repository: ghcr.io/freydv/bf-backend

# Backend on /api of the same host as the frontend; Traefik does not strip the prefix, the app serves it (ADR-038).
ingress:
  enabled: true
  className: traefik
  host: malinina.ca
  path: /api
  pathType: Prefix
  # Per client IP, per Traefik pod (two pods, so a client gets up to about twice this). 10 requests a second with 30 at
  # once is far above one person clicking through the admin, and still makes a scan of phone numbers through /api slow
  # (ADR-037). Operators behind one office NAT share it: raise it here if they ever hit 429. Kubelet probes go to the
  # pod directly and are not counted.
  rateLimit:
    enabled: true
    average: 10
    burst: 30

# The liveness endpoint of the backend, under the /api prefix the app serves itself (ADR-080).
probes:
  path: /api/health
