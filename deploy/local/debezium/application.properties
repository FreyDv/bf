# Local counterpart of the production settings file (ADR-023); credentials come from the environment.
debezium.source.connector.class=io.debezium.connector.postgresql.PostgresConnector
debezium.source.plugin.name=pgoutput
debezium.source.database.hostname=postgres
debezium.source.database.port=5432
debezium.source.database.dbname=bf_dev
debezium.source.topic.prefix=bf
debezium.source.slot.name=bf_slot
debezium.source.publication.name=bf_slot
debezium.source.publication.autocreate.mode=disabled
debezium.source.snapshot.mode=no_data
debezium.source.offset.storage=io.debezium.storage.jdbc.offset.JdbcOffsetBackingStore
debezium.source.offset.storage.jdbc.url=jdbc:postgresql://postgres:5432/bf_dev
debezium.source.offset.storage.jdbc.table.name=debezium_offsets
debezium.source.offset.flush.interval.ms=1000
debezium.sink.type=nats-jetstream
debezium.sink.nats-jetstream.url=nats://nats:4222
debezium.sink.nats-jetstream.create-stream=false
debezium.sink.nats-jetstream.storage=file
