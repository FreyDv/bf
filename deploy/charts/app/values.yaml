# Defaults for every application. An application supplies only values (ADR-019):
# deploy/apps/<app>/values.yaml (plain), secrets.yaml (sealed, ADR-020), image.yaml (tag written by CI, ADR-030).

image:
  repository: '' # required, ghcr.io/<owner>/<app> (ADR-026)
  tag: '' # required, the commit SHA; `latest` is refused
  pullPolicy: IfNotPresent

replicas: 1
port: 3000

# Empty keeps the image entrypoint.
command: []
args: []

# Plain environment variables. Anything secret goes to `secret`.
env: {}

# Names of existing Secrets mounted whole as environment into the Deployment and the CronJobs (never the migration
# Job), in addition to the one built from `secret`. An extraSecrets entry other than `migrator` is reached this way,
# by its name <release>-<name>-secrets.
envFromSecrets: []

# Values encrypted with kubeseal for exactly this name and namespace (strict scope, ADR-020);
# `pnpm secrets:seal` writes them. The chart builds one SealedSecret named <release>-secrets, read by the Deployment
# and the CronJobs. With a database it carries all of DB_HOST, DB_PORT, DB_NAME, DB_SCHEMA, DB_SSL_MODE, DB_USER and
# DB_PASSWORD of the role `app` (never DATABASE_URL, ADR-061).
secret:
  encryptedData: {}

# More SealedSecrets, the shape `pnpm secrets:seal` writes from apps/<app>/.env.<name>.production (ADR-060):
#   extraSecrets: { <name>: { encryptedData: { KEY: ciphertext } } }
# each rendered as <release>-<name>-secrets on wave -1. `migrator` is the only name the chart attaches itself: the
# migration Job reads it and nothing else, and the Deployment never does. It carries the seven DB_* names of the role
# `migrator`. Any other entry is rendered and attached to nothing unless listed in envFromSecrets (ADR-061).
extraSecrets: {}

# The public CA certificate of the database (ADR-053 item 5): PEM text. When set, the chart renders a ConfigMap on
# wave -1, mounts it read-only at /etc/bf/db-ca/ca.crt in the Deployment, the CronJobs and the migration Job, and sets
# DB_SSL_CA_FILE to that path. Required by any secret holding a DB_* key and by the migration; an application
# without a database leaves it empty.
dbCa:
  pem: ''

service:
  enabled: true
  port: 80

ingress:
  enabled: false
  className: traefik
  host: ''
  path: /
  pathType: Prefix
  annotations: {}

# Ingress-only NetworkPolicy on the pods of this release, on by default (ADR-037 item 4): the application port is
# reachable from the ingress controller (only when `ingress.enabled`) and from `allowFrom`, nothing else. Egress is not
# restricted here. Without an ingress and without neighbours the pods accept no incoming connection at all.
networkPolicy:
  enabled: true
  ingressControllerNamespace: traefik # ADR-038
  # Further peers, each a standard NetworkPolicyPeer (podSelector and/or namespaceSelector). Without a
  # namespaceSelector a peer means pods of the release namespace. A non-list or an empty peer is refused.
  allowFrom: []

# Empty `path` probes the TCP port; an application that serves a health endpoint sets it (ADR-080).
probes:
  path: ''
  initialDelaySeconds: 5
  periodSeconds: 10

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 512Mi

# Matches the non-root user of the node image (ADR-027). The root filesystem is read-only; /tmp is writable.
securityContext:
  runAsUser: 1000
  runAsGroup: 1000
  readOnlyRootFilesystem: true

# Each item: name, schedule, command, args, concurrencyPolicy (default Forbid). Same image, env, secrets and CA as the Deployment.
cronJobs: []

# A hook Job that runs before the new version is synced; a failing migration stops the sync and the running
# version stays (ADR-019). It reads only extraSecrets.migrator and the plain `env` (ADR-053 item 4, ADR-061): the chart
# refuses `enabled` without that secret, without `secret` (role `app`) or without dbCa.pem.
migration:
  enabled: false
  command: []
  args: []
  backoffLimit: 0
  activeDeadlineSeconds: 600
