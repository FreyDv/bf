apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "app.fullname" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
  annotations:
    # The migration Job (wave 0) runs as this account, so it exists first (ADR-047).
    argocd.argoproj.io/sync-wave: "-1"
automountServiceAccountToken: false
