{{- include "app.validate" . -}}
{{- if .Values.secret.encryptedData }}
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  # Strict scope: the ciphertext is bound to this name and namespace (ADR-020).
  name: {{ include "app.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
  annotations:
    # Wave -1 of the Sync phase: applied before the migration Job (a Sync hook, wave 0) reads it (ADR-047).
    argocd.argoproj.io/sync-wave: "-1"
spec:
  encryptedData:
    {{- toYaml .Values.secret.encryptedData | nindent 4 }}
  template:
    metadata:
      name: {{ include "app.secretName" . }}
    type: Opaque
{{- end }}
{{- range $name, $extra := .Values.extraSecrets }}
{{- if and (kindIs "map" $extra) $extra.encryptedData }}
{{- $secretName := include "app.extraSecretName" (dict "root" $ "name" $name) }}
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  # One more secret per entry of extraSecrets, the shape `pnpm secrets:seal` writes (ADR-060). Strict scope, wave -1,
  # like the main one. Only `migrator` is attached to a workload by the chart (the migration Job); any other is
  # read by a pod only when its name is listed in envFromSecrets (ADR-061).
  name: {{ $secretName }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "app.labels" $ | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  encryptedData:
    {{- toYaml $extra.encryptedData | nindent 4 }}
  template:
    metadata:
      name: {{ $secretName }}
    type: Opaque
{{- end }}
{{- end }}
