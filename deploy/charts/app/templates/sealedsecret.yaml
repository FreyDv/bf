{{- if .Values.secret.encryptedData }}
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  # Strict scope: the ciphertext is bound to this name and namespace (ADR-020).
  name: {{ include "app.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
  annotations:
    # Created before the Pre-sync migration Job reads it.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  encryptedData:
    {{- toYaml .Values.secret.encryptedData | nindent 4 }}
  template:
    metadata:
      name: {{ include "app.secretName" . }}
    type: Opaque
{{- end }}
