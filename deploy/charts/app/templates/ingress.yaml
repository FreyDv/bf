{{- if .Values.ingress.enabled }}
{{- if not .Values.service.enabled }}
{{- fail "ingress.enabled needs service.enabled" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "app.fullname" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
  {{- $annotations := deepCopy (.Values.ingress.annotations | default dict) }}
  {{- if .Values.ingress.rateLimit.enabled }}
  {{- $key := "traefik.ingress.kubernetes.io/router.middlewares" }}
  {{- if hasKey $annotations $key }}
  {{- fail (printf "ingress.annotations sets %s while ingress.rateLimit is on; the chart writes it" $key) }}
  {{- end }}
  {{- $_ := set $annotations $key (printf "%s-%s@kubernetescrd" .Release.Namespace (include "app.rateLimitName" .)) }}
  {{- end }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ required "ingress.host is required when ingress is enabled" .Values.ingress.host }}
      http:
        paths:
          - path: {{ .Values.ingress.path }}
            pathType: {{ .Values.ingress.pathType }}
            backend:
              service:
                name: {{ include "app.fullname" . }}
                port:
                  name: http
{{- end }}
