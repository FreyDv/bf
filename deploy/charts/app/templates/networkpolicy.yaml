{{- if .Values.networkPolicy.enabled }}
{{- if not (kindIs "slice" .Values.networkPolicy.allowFrom) }}
{{- fail "networkPolicy.allowFrom must be a list of NetworkPolicyPeer items" }}
{{- end }}
{{- range $index, $peer := .Values.networkPolicy.allowFrom }}
{{- if or (not (kindIs "map" $peer)) (empty $peer) }}
{{- fail (printf "networkPolicy.allowFrom[%d] must be a non-empty NetworkPolicyPeer: an empty peer admits every pod" $index) }}
{{- end }}
{{- end }}
{{- /*
Ingress only: the egress of the application is not restricted by this chart. No sync wave on purpose: wave 0, so the
policy exists before the Deployment and the CronJob of wave 1 start (ADR-047).
*/}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "app.fullname" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "app.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  {{- if or .Values.ingress.enabled .Values.networkPolicy.allowFrom }}
  ingress:
    - from:
        {{- if .Values.ingress.enabled }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressControllerNamespace }}
        {{- end }}
        {{- with .Values.networkPolicy.allowFrom }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.port }}
  {{- else }}
  ingress: []
  {{- end }}
{{- end }}
