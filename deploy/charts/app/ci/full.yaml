# Every feature on: both database secrets, one more secret, the database CA, ingress with a rate limit, a neighbour
# allowed through the NetworkPolicy, cron jobs and the migration Job. The ciphertexts and the PEM are placeholders,
# not real values.
image:
  repository: ghcr.io/example/app
  tag: 0123456789abcdef0123456789abcdef01234567
port: 4000
replicas: 2
command: [node]
args: [dist/main.js]
env:
  NODE_ENV: production
  LOG_LEVEL: info
envFromSecrets: [shared-config]
secret:
  encryptedData:
    DB_HOST: AgBexampleciphertextapp1
    DB_PORT: AgBexampleciphertextapp2
    DB_NAME: AgBexampleciphertextapp3
    DB_SCHEMA: AgBexampleciphertextapp4
    DB_SSL_MODE: AgBexampleciphertextapp5
    DB_USER: AgBexampleciphertextapp6
    DB_PASSWORD: AgBexampleciphertextapp7
    OPENAI_API_KEY: AgBexampleciphertextapp8
extraSecrets:
  migrator:
    encryptedData:
      DB_HOST: AgBexampleciphertextmig1
      DB_PORT: AgBexampleciphertextmig2
      DB_NAME: AgBexampleciphertextmig3
      DB_SCHEMA: AgBexampleciphertextmig4
      DB_SSL_MODE: AgBexampleciphertextmig5
      DB_USER: AgBexampleciphertextmig6
      DB_PASSWORD: AgBexampleciphertextmig7
  reports:
    encryptedData:
      REPORTS_TOKEN: AgBexampleciphertextrep1
dbCa:
  pem: |
    -----BEGIN CERTIFICATE-----
    MIIBexamplePlaceholderCertificateNotARealOneAAAAAAAAAAAAAAAAAAAA
    -----END CERTIFICATE-----
ingress:
  enabled: true
  host: app.example.test
  rateLimit:
    enabled: true
    average: 10
    burst: 30
networkPolicy:
  allowFrom:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: frontend
probes:
  path: /health
cronJobs:
  - name: cleanup
    schedule: '0 3 * * *'
    command: [node]
    args: [dist/cron/cleanup.js]
migration:
  enabled: true
  command: [node]
  args: [dist/migrate.js]
