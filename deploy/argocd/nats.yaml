# NATS JetStream (ADR-022, backlog NATS-1). Applied by hand once:
#   kubectl apply -n argocd -f deploy/argocd/nats.yaml
# ArgoCD does not watch this repository until the owner applies root.yaml (ARGOCD-2); after that the root Application
# syncs this file (ADR-046). Until then this file is the whole source: the chart comes from the public Helm
# repository and the values are inline. Steps for the owner: docs/runbooks/malinina-kubernetes.md.
#
# Chart 2.15.2 (appVersion 2.15.2) was published 2026-10-29. ADR-005 needs 7 full days, so it was usable from
# 2026-11-05; on 2026-11-12 it is 14 days old. The server image below is the chart's own appVersion, and the other two
# images (config reloader, nats-box) are the exact tags that chart version ships, so a chart bump moves all three
# together. The ADR-034 exception does not cover this chart. `pnpm charts` renders exactly this chart with exactly
# these values (scripts/charts-check.ts).
#
# Namespace `bf`, not a separate one: the log collector of ADR-043 watches `bf`, and ADR-038 has one environment.
# ClusterIP only, no authentication by owner decision (ADR-082), see the runbook. Who may reach the client
# port is the NetworkPolicy in `extraResources` below (NATS-4, ADR-081).
# The stream is not created here: the owner creates it with nats-box (runbook), GitOps creation is NATS-5.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nats
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://nats-io.github.io/k8s/helm/charts
    chart: nats
    targetRevision: 2.15.2
    helm:
      valuesObject:
        # The Service and the pod are named `nats`: nats://nats.bf.svc:4222 is what Debezium and the app will use.
        fullnameOverride: nats
        config:
          # One pod, no cluster (ADR-022: 3 replicas and a replica without a disk are rejected options).
          cluster:
            enabled: false
          jetstream:
            enabled: true
            fileStore:
              pvc:
                # The stream is a transit buffer (ADR-021, ADR-022): there is no backup, and losing the volume loses
                # the events not yet read. Retain keeps the volume when the PVC or the Application is deleted; it
                # then stays, and is billed, until the owner removes it by hand (runbook, Rollback).
                size: 10Gi
                storageClassName: do-block-storage-retain
        container:
          image:
            repository: nats
            tag: 2.15.2-alpine
          # An assumption, not a measurement: the cluster has no metrics-server. No limits on purpose, so the broker
          # is not throttled or OOM-killed at a guessed ceiling. Replaced by the measured values in MON-2.
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
          # The chart has no securityContext value, so this goes through its merge hook. Not set: runAsNonRoot and
          # a read-only root, because the image user and the volume ownership are not verified without a cluster.
          merge:
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: [ALL]
        reloader:
          merge:
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: [ALL]
        podTemplate:
          # The merge target is the pod template (metadata and spec), so the pod fields sit under `spec`.
          merge:
            spec:
              # The server and the reloader read the config from a ConfigMap volume and never call the Kubernetes API.
              automountServiceAccountToken: false
              securityContext:
                seccompProfile:
                  type: RuntimeDefault
        # The `nats` CLI for the owner's steps (runbook): stream creation and the publish and read check.
        natsBox:
          enabled: true
          container:
            merge:
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
          podTemplate:
            merge:
              spec:
                automountServiceAccountToken: false
                securityContext:
                  seccompProfile:
                    type: RuntimeDefault
        # The metrics exporter, a sidecar of the server pod on port 7777 (container port named `prom-metrics`), scraped by the
        # Prometheus of the `monitoring` namespace (ADR-083, MON-1). The NetworkPolicy below lets in that namespace alone.
        # The exporter reads the monitor port 8222 inside the pod, so that port stays closed to everyone else.
        promExporter:
          enabled: true
          merge:
            # An assumption, not a measurement; no limits, as for the server above (MON-2 replaces it).
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: [ALL]
        # The chart has no networkPolicy value, so the policy goes through extraResources (ADR-081). Ingress only:
        # egress stays open (ADR-082), and an Egress type here would cut DNS. The selector names the component, because
        # name and instance alone also match nats-box and the helm test pod. 4222 has a rule for the apps and 7777
        # (the exporter, ADR-083) one for the namespace `monitoring` alone; the monitor port 8222 (also on Service
        # nats-headless) and 6222 stay closed to other pods; kubelet probes are host traffic, which Cilium admits. prune
        # is false on this Application, so deleting the policy from these values leaves it in the cluster until someone
        # deletes it by hand.
        extraResources:
          - apiVersion: networking.k8s.io/v1
            kind: NetworkPolicy
            metadata:
              name: nats
              namespace: bf
            spec:
              podSelector:
                matchLabels:
                  app.kubernetes.io/name: nats
                  app.kubernetes.io/instance: nats
                  app.kubernetes.io/component: nats
              policyTypes:
                - Ingress
              ingress:
                - ports:
                    - protocol: TCP
                      port: 4222
                  from:
                    # A release that needs NATS adds its name to this list (a worker release later). Debezium
                    # (CDC-2) must run in `bf` with this label: the label is a contract of ADR-081.
                    - podSelector:
                        matchExpressions:
                          - key: app.kubernetes.io/name
                            operator: In
                            values:
                              - backend
                              - debezium
                    - podSelector:
                        matchLabels:
                          app.kubernetes.io/name: nats
                          app.kubernetes.io/component: nats-box
                # The metrics scrape (ADR-083): any pod of the namespace `monitoring`, none of `bf` or elsewhere. The namespace
                # label is the one Kubernetes sets itself, so no pod can claim it.
                - ports:
                    - protocol: TCP
                      port: 7777
                  from:
                    - namespaceSelector:
                        matchLabels:
                          kubernetes.io/metadata.name: monitoring
  destination:
    server: https://kubernetes.default.svc
    namespace: bf
  syncPolicy:
    automated:
      # A chart change never deletes a broker object by itself; removing one is a person's decision.
      prune: false
    syncOptions:
      # The namespace is shared with the apps (ADR-038), so the Application creates it only if it is missing.
      - CreateNamespace=true
      - ServerSideApply=true
  # The API server fills these into the StatefulSet's volumeClaimTemplates after apply; the chart does not render
  # them, so without this the Application stays OutOfSync while the broker is Healthy (seen on the first sync,
  # ARGOCD-2). volumeClaimTemplates cannot change after creation, so ignoring these fields hides no real change.
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      name: nats
      jqPathExpressions:
        - .spec.volumeClaimTemplates[]?.apiVersion
        - .spec.volumeClaimTemplates[]?.kind
        - .spec.volumeClaimTemplates[]?.spec.volumeMode
        - .spec.volumeClaimTemplates[]?.status
