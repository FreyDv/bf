# Sealed Secrets controller (ADR-020, ADR-045, backlog SEALED-1). Applied by hand once:
#   kubectl apply -n argocd -f deploy/argocd/sealed-secrets.yaml
# ArgoCD does not watch this repository yet (ARGOCD-1), so this file is the whole source: the chart comes from the
# public Helm repository and the values are inline. Steps for the owner: docs/runbooks/malinina-kubernetes.md.
#
# Chart 2.22.0 (appVersion 0.41.2) was published 2026-10-26. ADR-005 needs 7 full days, so it was usable from
# 2026-11-02; on 2026-11-12 it is 17 days old. The ADR-034 exception does not cover this chart. A newer chart
# passes the same window and is changed here together with the kubeseal version in the runbook.
# `pnpm charts` renders exactly this chart with exactly these values (scripts/charts-check.ts).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://bitnami.github.io/sealed-secrets
    chart: sealed-secrets
    targetRevision: 2.22.0
    helm:
      valuesObject:
        # kubeseal looks for this name in kube-system by default, so the runbook and scripts/seal-secret.ts need no flags.
        fullnameOverride: sealed-secrets-controller
        # "0" turns the 30-day key renewal off (ADR-045): a one-copy backup of the private key (ADR-020) would go
        # stale unnoticed. Quoted: the chart reads a string, and a bare 0 is a number.
        keyrenewperiod: "0"
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      # A chart change never deletes a controller object by itself; removing one is a person's decision.
      prune: false
    syncOptions:
      - ServerSideApply=true
