# Everything. Usage (from repo root):
#   docker compose -f infra/docker-compose.yml up -d
# Each included file can also be run on its own (needs `docker network create bf_network`
# first, or ./infra/scripts/network.sh).
name: bf

include:
  - path: postgres/docker-compose.yml
  - path: redis/docker-compose.yml
  - path: kafka/docker-compose.yml
  - path: debezium/docker-compose.yml
  - path: nats/docker-compose.yml
  - path: rabbitmq/docker-compose.yml
  - path: clickhouse/docker-compose.yml
  - path: elastic/docker-compose.yml
  - path: minio/docker-compose.yml
  - path: mongo/docker-compose.yml
  - path: prometheus/docker-compose.yml
  - path: grafana/docker-compose.yml
  - path: otel/docker-compose.yml

networks:
  bf_network:
    name: bf_network
    # Included files declare bf_network as external; the explicit `false` here overrides
    # that in the merged model so this root file creates the network itself.
    external: false
