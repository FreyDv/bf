# Optional variant: 3-node cluster with TLS + basic auth (elastic / ELASTIC_PASSWORD).
#   docker compose -f infra/elastic/docker-compose.cluster.yml up -d
# Not included by the root compose files. Uses the same .env as the single-node setup.
services:
  setup:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTIC_STACK_VERSION:-8.19.2}
    container_name: bf-elastic-setup
    hostname: elastic-setup
    labels:
      - db
      - elasticsearch
      - init
    volumes:
      - elastic-certs:/usr/share/elasticsearch/config/certs
    user: '0'
    env_file:
      - .env
    command: >
      bash -c '
        if [ x${ELASTIC_PASSWORD} == x ]; then
          echo "Set the ELASTIC_PASSWORD environment variable in the .env file";
          exit 1;
        elif [ x${KIBANA_PASSWORD} == x ]; then
          echo "Set the KIBANA_PASSWORD environment variable in the .env file";
          exit 1;
        fi;
        if [ ! -f config/certs/ca.zip ]; then
          echo "Creating CA";
          bin/elasticsearch-certutil ca --silent --pem -out config/certs/ca.zip;
          unzip config/certs/ca.zip -d config/certs;
        fi;
        if [ ! -f config/certs/certs.zip ]; then
          echo "Creating certs";
          echo -ne \
          "instances:\n"\
          "  - name: es01\n"\
          "    dns:\n"\
          "      - es01\n"\
          "      - localhost\n"\
          "    ip:\n"\
          "      - 127.0.0.1\n"\
          "  - name: es02\n"\
          "    dns:\n"\
          "      - es02\n"\
          "      - localhost\n"\
          "    ip:\n"\
          "      - 127.0.0.1\n"\
          "  - name: es03\n"\
          "    dns:\n"\
          "      - es03\n"\
          "      - localhost\n"\
          "    ip:\n"\
          "      - 127.0.0.1\n"\
          > config/certs/instances.yml;
          bin/elasticsearch-certutil cert --silent --pem -out config/certs/certs.zip --in config/certs/instances.yml --ca-cert config/certs/ca/ca.crt --ca-key config/certs/ca/ca.key;
          unzip config/certs/certs.zip -d config/certs;
        fi;
        echo "Setting file permissions";
        chown -R root:root config/certs;
        find . -type d -exec chmod 750 \{\} \;;
        find . -type f -exec chmod 640 \{\} \;;
        echo "Waiting for Elasticsearch availability";
        until curl -s --cacert config/certs/ca/ca.crt https://es01:9200 | grep -q "missing authentication credentials"; do sleep 30; done;
        echo "Setting kibana_system password";
        until curl -s -X POST --cacert config/certs/ca/ca.crt -u "elastic:${ELASTIC_PASSWORD}" -H "Content-Type: application/json" https://es01:9200/_security/user/kibana_system/_password -d "{\"password\":\"${KIBANA_PASSWORD}\"}" | grep -q "^{}"; do sleep 10; done;
        echo "All done!";
      '
    healthcheck:
      test: ['CMD-SHELL', '[ -f config/certs/es01/es01.crt ]']
      interval: 1s
      timeout: 5s
      retries: 120
    networks:
      - elastic_network

  es01:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTIC_STACK_VERSION:-8.19.2}
    container_name: bf-es01
    hostname: es01
    restart: unless-stopped
    labels:
      - db
      - elasticsearch
    depends_on:
      setup:
        condition: service_healthy
    volumes:
      - elastic-certs:/usr/share/elasticsearch/config/certs
      - elastic-data01:/usr/share/elasticsearch/data
    ports:
      - ${ELASTIC_PORT:-9200}:9200
    environment:
      - node.name=es01
      - cluster.name=${ELASTIC_CLUSTER_NAME:-bf}
      - cluster.initial_master_nodes=es01,es02,es03
      - discovery.seed_hosts=es02,es03
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:-bfbfbf}
      - bootstrap.memory_lock=true
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=true
      - xpack.security.http.ssl.key=certs/es01/es01.key
      - xpack.security.http.ssl.certificate=certs/es01/es01.crt
      - xpack.security.http.ssl.certificate_authorities=certs/ca/ca.crt
      - xpack.security.transport.ssl.enabled=true
      - xpack.security.transport.ssl.key=certs/es01/es01.key
      - xpack.security.transport.ssl.certificate=certs/es01/es01.crt
      - xpack.security.transport.ssl.certificate_authorities=certs/ca/ca.crt
      - xpack.security.transport.ssl.verification_mode=certificate
      - xpack.license.self_generated.type=${ELASTIC_LICENSE:-basic}
    env_file:
      - .env
    mem_limit: ${ELASTIC_MEM_LIMIT:-1073741824}
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "curl -s --cacert config/certs/ca/ca.crt https://localhost:9200 | grep -q 'missing authentication credentials'",
        ]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - elastic_network
      - bf_network

  es02:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTIC_STACK_VERSION:-8.19.2}
    container_name: bf-es02
    hostname: es02
    restart: unless-stopped
    labels:
      - db
      - elasticsearch
    depends_on:
      - es01
    volumes:
      - elastic-certs:/usr/share/elasticsearch/config/certs
      - elastic-data02:/usr/share/elasticsearch/data
    environment:
      - node.name=es02
      - cluster.name=${ELASTIC_CLUSTER_NAME:-bf}
      - cluster.initial_master_nodes=es01,es02,es03
      - discovery.seed_hosts=es01,es03
      - bootstrap.memory_lock=true
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=true
      - xpack.security.http.ssl.key=certs/es02/es02.key
      - xpack.security.http.ssl.certificate=certs/es02/es02.crt
      - xpack.security.http.ssl.certificate_authorities=certs/ca/ca.crt
      - xpack.security.transport.ssl.enabled=true
      - xpack.security.transport.ssl.key=certs/es02/es02.key
      - xpack.security.transport.ssl.certificate=certs/es02/es02.crt
      - xpack.security.transport.ssl.certificate_authorities=certs/ca/ca.crt
      - xpack.security.transport.ssl.verification_mode=certificate
      - xpack.license.self_generated.type=${ELASTIC_LICENSE:-basic}
    env_file:
      - .env
    mem_limit: ${ELASTIC_MEM_LIMIT:-1073741824}
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "curl -s --cacert config/certs/ca/ca.crt https://localhost:9200 | grep -q 'missing authentication credentials'",
        ]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - elastic_network

  es03:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTIC_STACK_VERSION:-8.19.2}
    container_name: bf-es03
    hostname: es03
    restart: unless-stopped
    labels:
      - db
      - elasticsearch
    depends_on:
      - es02
    volumes:
      - elastic-certs:/usr/share/elasticsearch/config/certs
      - elastic-data03:/usr/share/elasticsearch/data
    environment:
      - node.name=es03
      - cluster.name=${ELASTIC_CLUSTER_NAME:-bf}
      - cluster.initial_master_nodes=es01,es02,es03
      - discovery.seed_hosts=es01,es02
      - bootstrap.memory_lock=true
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=true
      - xpack.security.http.ssl.key=certs/es03/es03.key
      - xpack.security.http.ssl.certificate=certs/es03/es03.crt
      - xpack.security.http.ssl.certificate_authorities=certs/ca/ca.crt
      - xpack.security.transport.ssl.enabled=true
      - xpack.security.transport.ssl.key=certs/es03/es03.key
      - xpack.security.transport.ssl.certificate=certs/es03/es03.crt
      - xpack.security.transport.ssl.certificate_authorities=certs/ca/ca.crt
      - xpack.security.transport.ssl.verification_mode=certificate
      - xpack.license.self_generated.type=${ELASTIC_LICENSE:-basic}
    env_file:
      - .env
    mem_limit: ${ELASTIC_MEM_LIMIT:-1073741824}
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "curl -s --cacert config/certs/ca/ca.crt https://localhost:9200 | grep -q 'missing authentication credentials'",
        ]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - elastic_network

  kibana:
    image: docker.elastic.co/kibana/kibana:${ELASTIC_STACK_VERSION:-8.19.2}
    container_name: bf-kibana
    hostname: kibana
    restart: unless-stopped
    labels:
      - ui
      - elasticsearch
      - kibana
    depends_on:
      es01:
        condition: service_healthy
      es02:
        condition: service_healthy
      es03:
        condition: service_healthy
    volumes:
      - elastic-certs:/usr/share/kibana/config/certs
      - kibana-data:/usr/share/kibana/data
    ports:
      - ${KIBANA_PORT:-5601}:5601
    environment:
      - SERVERNAME=kibana
      - ELASTICSEARCH_HOSTS=https://es01:9200
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=${KIBANA_PASSWORD:-bfbfbf}
      - ELASTICSEARCH_SSL_CERTIFICATEAUTHORITIES=config/certs/ca/ca.crt
    env_file:
      - .env
    mem_limit: ${ELASTIC_MEM_LIMIT:-1073741824}
    healthcheck:
      test: ['CMD-SHELL', "curl -s -I http://localhost:5601 | grep -q 'HTTP/1.1 302 Found'"]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - elastic_network
      - bf_network

networks:
  elastic_network:
    driver: bridge
    labels:
      - db
      - elasticsearch
  bf_network:
    external: true

volumes:
  elastic-certs:
    driver: local
    labels:
      - db
      - certs
      - elasticsearch
  elastic-data01:
    driver: local
    labels:
      - db
      - data
      - elasticsearch
  elastic-data02:
    driver: local
    labels:
      - db
      - data
      - elasticsearch
  elastic-data03:
    driver: local
    labels:
      - db
      - data
      - elasticsearch
  kibana-data:
    driver: local
    labels:
      - ui
      - data
      - kibana
