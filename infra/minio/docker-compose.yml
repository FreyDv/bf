services:
  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    container_name: bf-minio
    hostname: minio
    restart: unless-stopped
    labels:
      - s3
      - minio
    ports:
      - ${MINIO_API_PORT:-9000}:9000
      - ${MINIO_CONSOLE_PORT:-9001}:9001
    volumes:
      - minio-data:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-bfadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-bfbfbfbf}
      MINIO_BROWSER: ${MINIO_BROWSER:-on}
    env_file:
      - .env
    command: server /data --console-address ":9001"
    healthcheck:
      # The minio image ships mc but not curl.
      test: ['CMD', 'mc', 'ready', 'local']
      start_period: 10s
      interval: 3s
      timeout: 2s
      retries: 10
    networks:
      - minio_network
      - bf_network

  minio-init:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    container_name: bf-minio-init
    hostname: minio-init
    restart: 'no'
    labels:
      - s3
      - minio
      - init
    volumes:
      - ./minio-init:/minio-init:ro
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-bfadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-bfbfbfbf}
      MINIO_BUCKETS: ${MINIO_BUCKETS:-bf-order}
    env_file:
      - .env
    entrypoint: ['/bin/sh', '/minio-init/create-buckets.sh']
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - minio_network

networks:
  minio_network:
    driver: bridge
    labels:
      - s3
      - minio
  bf_network:
    external: true

volumes:
  minio-data:
    driver: local
    labels:
      - s3
      - data
      - minio
