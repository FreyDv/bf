global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # Apps run on the host (pnpm dev); host.docker.internal is mapped via extra_hosts.
  # Ports: api 3000 (edge), auth 3001, order 3002, course 3003, billing 3004, admin 3005, ai 3006.
  - job_name: services
    metrics_path: /metrics
    static_configs:
      - targets:
          - 'host.docker.internal:3000'
          - 'host.docker.internal:3001'
          - 'host.docker.internal:3002'
          - 'host.docker.internal:3003'
          - 'host.docker.internal:3004'
          - 'host.docker.internal:3005'
          - 'host.docker.internal:3006'

  # OTLP metrics exported by the collector (infra/otel) over bf_network.
  - job_name: otel-collector
    static_configs:
      - targets: ['otel-collector:8889']
