name: ci

# ADR-018: the guarantee behind the bypassable pre-commit hook. Steps run in the ADR order and stop
# on the first failure: tsc -> prettier -> eslint -> boundaries -> unit. Still to come, as the code
# they need appears: e2e against a test database and NATS (TEST-1), migration check (ADR-013),
# image build on `main` (CI-1). Folds in the former `boundaries` workflow (ENF-1, ADR-014).
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          # `turbo --affected` diffs against the base branch.
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install pnpm
        # Node 26 does not bundle corepack; the version is the one pinned in package.json.
        run: npm install --global pnpm@11.28.10
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          # Local Turborepo cache only; no remote cache service (ADR-009).
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Did the deploy files change
        id: deploy
        run: |
          if git diff --name-only "origin/${{ github.base_ref || 'main' }}...HEAD" | grep -qE '^(deploy/(charts|apps)/|scripts/charts)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Contracts are generated
        # ADR-035: the committed `AppRouter` type must equal what the routers produce; before typecheck, which reads it.
        run: pnpm contracts:check

      # Pull requests check what they touch; a push to `main` checks everything.
      - name: Typecheck
        run: pnpm turbo run typecheck ${{ github.event_name == 'pull_request' && '--affected' || '' }}
      - name: Prettier
        run: pnpm format:check
      - name: ESLint
        run: pnpm turbo run lint ${{ github.event_name == 'pull_request' && '--affected' || '' }}
      - name: Architecture boundaries
        # From the root, outside Turborepo (ADR-009): a violation cannot hide behind a cache hit.
        run: pnpm deps
      - name: Boundary rules fire on violations
        run: pnpm deps:test
      - name: Unit tests
        run: pnpm turbo run test ${{ github.event_name == 'pull_request' && '--affected' || '' }}
      - name: Helm chart
        # Only when the deploy files changed on a pull request (ADR-019); Helm is preinstalled on the runner.
        if: github.event_name != 'pull_request' || steps.deploy.outputs.changed == 'true'
        run: |
          pnpm charts
          pnpm charts:test
