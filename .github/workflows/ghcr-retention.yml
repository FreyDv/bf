name: ghcr-retention

# ADR-074 (GHCR-1), ADR-026 item 7: deletes old image versions of bf-<app> in GHCR. Keeps the tag of
# deploy/apps/<app>/image.yaml, the last 20 tags of its history (rollback by revert), everything younger than 30 days
# and what a kept image index points at (scripts/ghcr-retention.ts). The scheduled run deletes; a manual run only
# prints the plan unless `apply` is set. Separate from `ci.yml`: the one job here holds `packages: write`, the
# exception to ADR-026 item 3 that ADR-074 records.
on:
  schedule:
    # Sunday 06:00 UTC.
    - cron: '0 6 * * 0'
  workflow_dispatch:
    inputs:
      apply:
        description: Delete the versions (otherwise print the plan only)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ghcr-retention
  cancel-in-progress: false

jobs:
  retention:
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The history of image.yaml names the rollback candidates.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Delete old image versions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_OWNER: ${{ github.repository_owner }}
        # Plain node, no dependencies: the script imports only node: modules and scripts/commit-image-tag.ts.
        run: node scripts/ghcr-retention.ts ${{ (github.event_name == 'schedule' || inputs.apply) && '--apply' || '' }}
