name: infra

# Applies the CDK stack `bf-prod` (VPC, Aurora, S3, the EC2 host, DNS) to the single AWS environment.
# Runs only when infra/aws changes on main, or on demand. App code goes through deploy.yml and never touches
# CloudFormation. The diff of what this will do is posted on the PR by preview.yml BEFORE you merge.
#   snapshot (Aurora snapshot + S3 export, skipped automatically on the very first deploy)
#   → `cdk deploy` as bf-gha-infra: it only hands the work to the CDK roles; CloudFormation itself is limited
#     to the bf-cfn-exec policy (infra/aws/lib/github-stack.ts).
# The stack bf-github (those roles) is NOT deployed here — only from a laptop: infra/aws/scripts/bootstrap.ts.

on:
  push:
    branches: [main]
    paths: ['infra/aws/**', '.github/workflows/infra.yml', '.github/actions/aws-auth/**']
  workflow_dispatch:
    inputs:
      skip_snapshot:
        description: skip the pre-change DB snapshot (not recommended)
        type: boolean
        default: false

concurrency:
  group: infra-prod
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  snapshot:
    name: db snapshot
    if: github.event.inputs.skip_snapshot != 'true'
    uses: ./.github/workflows/db-snapshot.yml
    with:
      label: infra-${{ github.sha }}

  cdk:
    name: cdk deploy
    needs: snapshot
    if: always() && (needs.snapshot.result == 'success' || needs.snapshot.result == 'skipped')
    runs-on: ubuntu-latest
    environment: prod # keep equal to `env` in infra/aws/lib/config.ts
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile --ignore-scripts --filter "@bf/infra-aws..."
      - uses: ./.github/actions/aws-auth
        with: { role: bf-gha-infra, account-id: '${{ vars.AWS_ACCOUNT_ID }}' }
      - run: pnpm aws:deploy
