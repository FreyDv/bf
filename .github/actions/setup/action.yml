name: setup
description: >
  pnpm + Node (version from .nvmrc) + a frozen-lockfile install, optionally narrowed to one workspace and its
  dependencies, optionally with a Turborepo cache. Requires a prior actions/checkout.
inputs:
  filter:
    description: pnpm --filter selector to install for (e.g. "auth..."); empty installs the whole workspace
    default: ''
  ignore-scripts:
    description: 'true skips postinstall scripts (enough for scripts that only read the repo or call AWS)'
    default: 'false'
  turbo-cache:
    description: key prefix for the .turbo cache; empty disables the cache
    default: ''
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v4
      with: { node-version-file: .nvmrc, cache: pnpm }
    - if: inputs.filter == ''
      shell: bash
      run: pnpm install --frozen-lockfile ${{ inputs.ignore-scripts == 'true' && '--ignore-scripts' || '' }}
    - if: inputs.filter != ''
      shell: bash
      env:
        FILTER: ${{ inputs.filter }}
      run: pnpm install --frozen-lockfile ${{ inputs.ignore-scripts == 'true' && '--ignore-scripts' || '' }} --filter "$FILTER"
    - if: inputs.turbo-cache != ''
      uses: actions/cache@v4
      with:
        path: .turbo
        key: turbo-${{ runner.os }}-${{ inputs.turbo-cache }}-${{ github.sha }}
        restore-keys: |
          turbo-${{ runner.os }}-${{ inputs.turbo-cache }}-
