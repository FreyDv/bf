packages:
  - 'apps/*'
  - 'packages/*'

# Supply chain (ADR-005, R21): exact versions, 7-day release cooldown, no unreviewed install scripts.
saveExact: true
minimumReleaseAge: 10080
enablePrePostScripts: false
allowBuilds:
  '@swc/core': true
  esbuild: true
  sharp: true
  lefthook: true
  unrs-resolver: true

# IMG-2: the backend runs the express adapter of @trpc/server; its optional peer next and its type-only peer typescript
# are not needed at runtime and must not enter the backend image.
overrides:
  '@trpc/server>next': '-'
  '@trpc/server>typescript': '-'
