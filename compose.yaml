# Local environment (ADR-033). Defaults are for this machine only (ports bind to 127.0.0.1).
# Roles as on the managed database (ADR-053): `doadmin` (no superuser, REPLICATION; Debezium and the owner's manual
# work), `migrator` (owns the objects, runs DDL) and `app` (DML only, schema `app`, ADR-078); the superuser
# `postgres` only bootstraps the cluster. The init applies database/roles/*.sql to bf_dev and bf_test (ADR-079).
# Postgres 18.6 is the version running on DO, taken without the cooldown under ADR-034; the other tags pass the 7-day cooldown (ADR-005).
#
# Fixed on purpose (LOCAL-2): the database names bf_dev and bf_test and the doadmin password bf_local_only live in
# deploy/local/postgres/init/ and are read by Debezium below and by the tests (AGENTS.md, Commands), so neither is
# taken from the environment. The init files run only on an empty volume: after changing them, `pnpm local:reset`
# (drops the volumes) and `pnpm local:up`.
# The postgres settings mirror bfdb. wal_keep_size and max_wal_size are disk in the volume (up to about 3 GB of WAL),
# not memory; memory is shared_buffers (780 MB) plus the work memory of each connection. On a Docker with less memory
# lower them in a compose.override.yaml next to this file (git-ignored, read by `docker compose` on its own).
name: bf

services:
  postgres:
    image: postgres:18.6
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=20
      - -c
      - max_wal_senders=20
      - -c
      - wal_keep_size=2920MB
      - -c
      - max_wal_size=2921MB
      - -c
      - checkpoint_timeout=900s
      - -c
      - synchronous_commit=off
      - -c
      - shared_buffers=780MB
      - -c
      - effective_cache_size=2397184kB
      - -c
      - maintenance_work_mem=272384kB
      - -c
      - random_page_cost=1
      - -c
      - effective_io_concurrency=13
      - -c
      - idle_in_transaction_session_timeout=86400000
      - -c
      - log_min_duration_statement=1000
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_local_only}
      # Fixed, not ${POSTGRES_DB}: the init files and Debezium name bf_dev (see the top of this file).
      POSTGRES_DB: bf_dev
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql
      - ./deploy/local/postgres/init:/docker-entrypoint-initdb.d:ro
      # The files the owner applies to bf, read by the init to set up bf_dev and bf_test the same way (ADR-079).
      - ./database/roles:/database/roles:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 12

  nats:
    image: nats:2.15.2-alpine
    command: ['-js', '-sd', '/data', '-m', '8222']
    ports:
      - '127.0.0.1:${NATS_PORT:-4222}:4222'
      - '127.0.0.1:${NATS_MONITOR_PORT:-8222}:8222'
    volumes:
      - natsdata:/data
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8222/healthz']
      interval: 5s
      timeout: 3s
      retries: 12

  # Needs the replication SQL file (backlog CDC-1) and an existing stream; start with `pnpm local:cdc`.
  debezium:
    profiles: [cdc]
    image: quay.io/debezium/server:3.6.3.Final
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    environment:
      DEBEZIUM_SOURCE_DATABASE_USER: doadmin
      DEBEZIUM_SOURCE_DATABASE_PASSWORD: bf_local_only
      DEBEZIUM_SOURCE_OFFSET_STORAGE_JDBC_USER: doadmin
      DEBEZIUM_SOURCE_OFFSET_STORAGE_JDBC_PASSWORD: bf_local_only
    volumes:
      - ./deploy/local/debezium/application.properties:/debezium/config/application.properties:ro

volumes:
  pgdata:
  natsdata:
